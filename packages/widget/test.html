<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Janua Widget Test</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
        color: #111827;
      }

      main {
        max-width: 820px;
        margin: 0 auto;
        padding: 80px 24px;
      }

      .hero {
        padding: 48px;
        border-radius: 32px;
        background: rgba(255, 255, 255, 0.78);
        border: 1px solid rgba(15, 23, 42, 0.08);
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <h1>Welcome to Janua Spa</h1>
        <p>This page simulates a spa website embedding the Janua widget.</p>
        <p>Try asking: "What spa services do you offer?" or "I want to book a massage".</p>
      </section>
    </main>
    <script src="./dist/widget.js" data-token="dev-site-token" data-base-url="http://localhost:3000"></script>
  </body>
</html>
